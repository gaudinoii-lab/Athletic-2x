<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Athletic 2x" />
  <title>Athletic 2x</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">PROGRAMMA 2× SETTIMANA</p>
        <h1>Athletic 2x</h1>
      </div>
      <button id="homeBtn" class="icon-btn" aria-label="Home" title="Home">⌂</button>
    </header>

    <main id="app"></main>

    <nav class="bottom-nav" aria-label="Navigazione principale">
      <button data-nav="home" class="nav-btn active">Home</button>
      <button data-nav="history" class="nav-btn">Storico</button>
      <button data-nav="settings" class="nav-btn">Impostazioni</button>
    </nav>
  </div>

  <div id="timerSheet" class="timer-sheet hidden" role="dialog" aria-modal="true" aria-labelledby="timerTitle">
    <div class="timer-card">
      <p class="eyebrow">RECUPERO</p>
      <h2 id="timerTitle">Prossima serie</h2>
      <div id="timerValue" class="timer-value">01:30</div>
      <div class="timer-actions">
        <button id="add30Btn" class="secondary-btn">+30 sec</button>
        <button id="skipTimerBtn" class="primary-btn">Salta</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
